services:
  backend:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: ${DATABASE_URL}

  frontend:
    build:
      context: ./frontend
      args:
        # Address the browser uses to reach the API
        VITE_API_BASE: http://localhost:8080
    ports:
      - "4173:80"
    depends_on:
      - backend
